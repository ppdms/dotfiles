# Tern's /wire WebSocket insists on ?token=; the omp vhosts add it so browsers
# never carry it. The value lives in the encrypted nginx credential (field
# omp-web-token.conf, delivered to /run/secrets by homelab-secrets), never in
# this repository. Included once per omp server block.
#
# Unset field: the glob matches nothing, the variable stays empty, and the
# /wire locations answer 503 instead of forwarding an unauthenticated request.
set $omp_web_token "";
include /run/secrets/omp-web-token*.conf;
