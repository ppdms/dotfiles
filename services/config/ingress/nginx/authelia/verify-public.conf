# Shared Authelia forward-auth — server-level include for *.@public-domain@ hosts.
# Same machinery as verify.conf, but the 401 bounce targets the public portal:
# LAN users land on the public Authelia session, so one login covers every
# gated public hostname. The @lan-domain@ portal session is a different cookie and
# does not satisfy this gate.
error_page 401 =302 https://auth.@public-domain@/?rd=https://$host$request_uri;

location = /authelia {
    internal;
    set $up_authelia_verify @backend-authelia@;
    proxy_pass http://$up_authelia_verify/api/verify;
    proxy_set_header Host $host;
    proxy_set_header X-Original-URL https://$host$request_uri;
    proxy_set_header X-Forwarded-For $ingress_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_read_timeout 60s;
}
