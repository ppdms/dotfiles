# Server-level forward authorization through /api/verify.
error_page 401 =302 https://auth.@lan-domain@/?rd=$scheme://$host$request_uri;

location = /authelia {
    internal;
    set $up_authelia_verify @backend-authelia@;
    proxy_pass http://$up_authelia_verify/api/verify;
    proxy_set_header Host $host;
    proxy_set_header X-Original-URL $scheme://$host$request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_read_timeout 60s;
}
