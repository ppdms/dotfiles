# LibreSpeed via Cloudflare + LAN-direct — speedtest.@public-domain@
# Socket block (remote, Access-gated) + high loopback TLS (LAN-direct with the
# public wildcard certificate, Authelia-gated). Buffering would distort
# measurements on both paths. Split: nginx cannot SNI-select a certificate
# when TCP and Unix listeners share one server.
server {
    listen unix:/run/cloudflared-origin/http.sock;
    server_name speedtest.@public-domain@;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Host              speedtest.@public-domain@;
    proxy_set_header X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    set $up_speedtest @backend-speedtest@;
    location / {
        proxy_pass http://$up_speedtest;
    }
}
# LAN-direct: same name/upstream, high loopback TLS with the public wildcard and
# the public Authelia gate.
server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name speedtest.@public-domain@;
    ssl_certificate /run/secrets/tls-public.crt;
    ssl_certificate_key /run/secrets/tls-public.key;
    proxy_buffering off;
    proxy_request_buffering off;
    error_page 497 https://$host$request_uri;

    include /etc/nginx/ingress/authelia/verify-public.conf;

    set $up_speedtest @backend-speedtest@;

    location / {
        include /etc/nginx/ingress/authelia/auth_request.conf;

        proxy_pass http://$up_speedtest;
        proxy_set_header Host              speedtest.@public-domain@;
        proxy_set_header X-Real-IP         $remote_addr;
        # This is the ingress boundary: never trust client-supplied forwarding.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
