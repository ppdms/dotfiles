# Tree-eclass via Cloudflare + LAN-direct — uni.@public-domain@
# Own login; not gated by Authelia. Upstream serves API + UI on 8001.
server {
    listen unix:/run/cloudflared-origin/http.sock;
    server_name uni.@public-domain@;
    client_max_body_size 500M;
    proxy_set_header Host              uni.@public-domain@;
    proxy_set_header X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  uni.@public-domain@;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_redirect     off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    send_timeout       600s;
    keepalive_timeout  75s;
    gzip off;
    set $up_tree @backend-tree-eclass@;
    include /run/nginx-state/tree-upstream.conf;
    location / {
        proxy_pass http://$up_tree;
    }
}
# LAN-direct: same name/upstream, high loopback TLS with the public wildcard.
server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name uni.@public-domain@;
    ssl_certificate /run/secrets/tls-public.crt;
    ssl_certificate_key /run/secrets/tls-public.key;
    client_max_body_size 500M;
    error_page 497 https://$host$request_uri;

    set $up_tree @backend-tree-eclass@;
    include /run/nginx-state/tree-upstream.conf;

    location / {
        proxy_pass http://$up_tree;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host uni.@public-domain@;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the ingress boundary: never trust client-supplied forwarding.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
