# Home Assistant via Cloudflare + LAN-direct — ha.@public-domain@
# Socket block (remote, Access-gated; HA handles its own auth) + TCP
# high loopback TLS (LAN-direct with the public wildcard certificate). Split: nginx
# cannot SNI-select a certificate when TCP and Unix listeners share one
# server.
server {
    listen unix:/run/cloudflared-origin/http.sock;
    server_name ha.@public-domain@;
    client_max_body_size 100M;
    proxy_set_header Host              ha.@public-domain@;
    proxy_set_header X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  ha.@public-domain@;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    set $up_ha @backend-homeassistant@;
    location / {
        proxy_pass https://$up_ha;
        proxy_ssl_verify off;
    }
}
# LAN-direct: same name/upstream, high loopback TLS with the public wildcard.
server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name ha.@public-domain@;
    ssl_certificate /run/secrets/tls-public.crt;
    ssl_certificate_key /run/secrets/tls-public.key;
    client_max_body_size 100M;
    error_page 497 https://$host$request_uri;
    proxy_set_header Host              ha.@public-domain@;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  ha.@public-domain@;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    set $up_ha @backend-homeassistant@;
    location / {
        proxy_pass https://$up_ha;
        proxy_ssl_verify off;
    }
}
