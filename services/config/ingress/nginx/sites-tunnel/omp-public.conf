# OMP (Tern web terminal) via Cloudflare + LAN-direct — omp.@public-domain@
# Socket block (remote, Access-gated) + high loopback TLS (LAN-direct with the
# public wildcard, public-Authelia-gated). Split: nginx cannot SNI-select a
# certificate when TCP and Unix listeners share one server.
# Remote path relies on Cloudflare Access (cloudflared also enforces the app's
# audTag before dialling this socket); the LAN path enforces the public
# Authelia session. Tern itself has no user authentication.
#
# Tern insists on a ?token= for its /wire WebSocket; nginx adds it so browsers
# never carry it (value: nginx credential omp-web-token.conf). Defence in depth:
# only root, the operator and nginx may reach 127.0.0.1:@port-omp@.
server {
    listen unix:/run/cloudflared-origin/http.sock;
    server_name omp.@public-domain@;
    client_max_body_size 50M;
    proxy_set_header Host              omp.@public-domain@;
    proxy_set_header X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  omp.@public-domain@;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_redirect     off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout       3600s;
    keepalive_timeout  75s;
    gzip off;
    set $up_omp @backend-omp@;
    include /etc/nginx/ingress/omp-wire-token.conf;
    location / {
        proxy_pass http://$up_omp;
    }
    location /wire {
        if ($omp_web_token = "") {
            return 503;
        }
        if ($args = "") {
            rewrite ^/wire$ /wire?token=$omp_web_token break;
        }
        proxy_pass http://$up_omp;
    }
}
# LAN-direct: same name/upstream, high loopback TLS with the public wildcard and
# the public Authelia gate.
server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name omp.@public-domain@;
    ssl_certificate /run/secrets/tls-public.crt;
    ssl_certificate_key /run/secrets/tls-public.key;
    client_max_body_size 50M;
    error_page 497 https://$host$request_uri;

    include /etc/nginx/ingress/authelia/verify-public.conf;

    set $up_omp @backend-omp@;
    include /etc/nginx/ingress/omp-wire-token.conf;

    location / {
        include /etc/nginx/ingress/authelia/auth_request.conf;

        proxy_pass http://$up_omp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host omp.@public-domain@;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the ingress boundary: never trust client-supplied forwarding.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /wire {
        include /etc/nginx/ingress/authelia/auth_request.conf;

        if ($omp_web_token = "") {
            return 503;
        }
        if ($args = "") {
            rewrite ^/wire$ /wire?token=$omp_web_token break;
        }

        proxy_pass http://$up_omp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host omp.@public-domain@;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
