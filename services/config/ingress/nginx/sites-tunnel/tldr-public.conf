# Readeck via Cloudflare + LAN-direct — tldr.@public-domain@
# Socket block (remote, Access-gated) + high loopback TLS (LAN-direct with the
# public wildcard certificate; Readeck handles its own auth + native OIDC).
# Split: nginx cannot SNI-select a certificate when TCP and Unix listeners
# share one server.
server {
    listen unix:/run/cloudflared-origin/http.sock;
    server_name tldr.@public-domain@;
    client_max_body_size 50M;
    proxy_set_header Host              tldr.@public-domain@;
    proxy_set_header X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  tldr.@public-domain@;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    set $up_tldr @backend-readeck@;
    location / {
        proxy_redirect http:// https://;
        proxy_pass http://$up_tldr;
    }
}
# LAN-direct: same name/upstream, high loopback TLS with the public wildcard.
# Readeck handles its own auth and native Authelia OIDC.
server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name tldr.@public-domain@;
    ssl_certificate /run/secrets/tls-public.crt;
    ssl_certificate_key /run/secrets/tls-public.key;
    client_max_body_size 50M;
    error_page 497 https://$host$request_uri;

    set $up_tldr @backend-readeck@;

    location / {
        proxy_redirect http:// https://;
        proxy_pass http://$up_tldr;
        proxy_http_version 1.1;
        proxy_set_header Host tldr.@public-domain@;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the ingress boundary: never trust client-supplied forwarding.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
