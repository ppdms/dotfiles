# Transmission via Cloudflare + LAN-direct — torrents.@public-domain@
# Socket block (remote, Access-gated; Transmission RPC auth enforced)
# + high loopback TLS (LAN-direct with the public wildcard certificate,
# Authelia-gated). Split: nginx cannot SNI-select a certificate when TCP and
# Unix listeners share one server.
server {
    listen unix:/run/cloudflared-origin/http.sock;
    server_name torrents.@public-domain@;
    client_max_body_size 500M;
    proxy_hide_header X-Frame-Options;
    proxy_set_header Host              torrents.@public-domain@;
    proxy_set_header X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Protocol https;
    proxy_pass_header X-Transmission-Session-Id;
    proxy_set_header X-Forwarded-Host  torrents.@public-domain@;
    proxy_set_header X-Forwarded-Server torrents.@public-domain@;
    proxy_read_timeout 300s;
    set $up_torrents @backend-transmission@;
    location / {
        proxy_pass http://$up_torrents;
    }
}
# LAN-direct: same name/upstream, high loopback TLS with the public wildcard and
# the public Authelia gate.
server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name torrents.@public-domain@;
    ssl_certificate /run/secrets/tls-public.crt;
    ssl_certificate_key /run/secrets/tls-public.key;
    client_max_body_size 500M;
    proxy_hide_header X-Frame-Options;
    error_page 497 https://$host$request_uri;

    include /etc/nginx/ingress/authelia/verify-public.conf;

    set $up_torrents @backend-transmission@;

    location / {
        include /etc/nginx/ingress/authelia/auth_request.conf;

        proxy_read_timeout  300s;
        proxy_set_header    Host                 torrents.@public-domain@;
        proxy_set_header    X-Forwarded-Proto    $scheme;
        proxy_set_header    X-Forwarded-Protocol $scheme;
        proxy_set_header    X-Real-IP            $remote_addr;
        proxy_pass_header   X-Transmission-Session-Id;
        proxy_set_header    X-Forwarded-Host     $host;
        proxy_set_header    X-Forwarded-Server   $host;
        # This is the ingress boundary: never trust client-supplied forwarding.
        proxy_set_header    X-Forwarded-For      $remote_addr;
        proxy_pass          http://$up_torrents;
    }
}
