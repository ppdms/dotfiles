# Termix via Cloudflare + LAN-direct — term.@public-domain@
# Socket block (remote, Access-gated) + high loopback TLS (LAN-direct with
# the public wildcard certificate). Split: nginx cannot SNI-select a certificate
# when TCP and Unix listeners share one server.
# Like the LAN vhost: no nginx auth gate — Termix's own OIDC-only flow
# (silent redirect to auth.@public-domain@) is the boundary. An auth gate here
# would validate the public session while the OIDC code binds to the same
# portal, but Access already gates the remote path before nginx.
map $http_upgrade $termix_tunnel_connection {
    default     "upgrade";
    ""          "keep-alive";
}
map $http_upgrade $termix_lan_connection {
    default     "upgrade";
    ""          "keep-alive";
}
server {
    listen unix:/run/cloudflared-origin/http.sock;
    server_name term.@public-domain@;
    proxy_set_header Host              term.@public-domain@;
    proxy_set_header X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  term.@public-domain@;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection $termix_tunnel_connection;
    proxy_redirect     off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout       3600s;
    keepalive_timeout  75s;
    gzip off;
    set $up_termix @backend-termix@;
    location / {
        proxy_pass http://$up_termix;
    }
}
# LAN-direct: same name/upstream, high loopback TLS.
# Split from the socket block: nginx cannot SNI-select
# a certificate when TCP and Unix listeners share one server.
server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name term.@public-domain@;
    ssl_certificate /run/secrets/tls-public.crt;
    ssl_certificate_key /run/secrets/tls-public.key;
    proxy_set_header Host              term.@public-domain@;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  term.@public-domain@;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection $termix_lan_connection;
    proxy_redirect     off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout       3600s;
    keepalive_timeout  75s;
    gzip off;
    set $up_termix @backend-termix@;
    location / {
        proxy_pass http://$up_termix;
    }
}
