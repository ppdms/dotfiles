# Immich via Cloudflare + LAN-direct — photos.@public-domain@
# Socket block (remote, Access-gated) + high loopback TLS (LAN-direct with the
# public wildcard certificate). Split: nginx cannot SNI-select a certificate
# when TCP and Unix listeners share one server.
server {
    listen unix:/run/cloudflared-origin/http.sock;
    server_name photos.@public-domain@;
    client_max_body_size 50000M;
    proxy_set_header Host              photos.@public-domain@;
    proxy_set_header X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_redirect     off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    send_timeout       600s;
    proxy_request_buffering off;
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'wasm-unsafe-eval'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src 'self' blob:;" always;
    set $up_photos @backend-immich@;
    location / {
        proxy_pass http://$up_photos;
    }
}
# LAN-direct: same name/upstream, high loopback TLS with the public wildcard.
# Split from the socket block: nginx cannot SNI-select a certificate when
# TCP and Unix listeners share one server.
server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name photos.@public-domain@;
    ssl_certificate /run/secrets/tls-public.crt;
    ssl_certificate_key /run/secrets/tls-public.key;
    client_max_body_size 50000M;
    # Browser Host must stay the public name: Immich builds its OIDC
    # redirect_uri from it (must match Authelia's registered redirect_uris),
    # and it selects the public portal end-to-end (issuer auth.@public-domain@).
    proxy_set_header Host              photos.@public-domain@;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_redirect     off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    send_timeout       600s;
    proxy_request_buffering off;
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'wasm-unsafe-eval'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src 'self' blob:;" always;
    set $up_photos @backend-immich@;
    location / {
        proxy_pass http://$up_photos;
    }
}
