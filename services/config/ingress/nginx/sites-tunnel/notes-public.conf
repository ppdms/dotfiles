# SilverBullet via Cloudflare + LAN-direct — notes.@public-domain@
# Socket block (remote, Access-gated) + high loopback TLS (LAN-direct with the
# public wildcard certificate, Authelia-gated). Split: nginx cannot SNI-select a
# certificate when TCP and Unix listeners share one server.
# The remote path relies on Cloudflare Access only.
# The LAN path enforces the public Authelia session because
# the backend itself runs unauthenticated.
server {
    listen unix:/run/cloudflared-origin/http.sock;
    server_name notes.@public-domain@;
    client_max_body_size 500M;
    proxy_set_header Host              notes.@public-domain@;
    proxy_set_header X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  notes.@public-domain@;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_redirect     off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout       3600s;
    keepalive_timeout  75s;
    gzip off;
    set $up_notes @backend-silverbullet@;
    location / {
        proxy_pass http://$up_notes;
    }
}
# LAN-direct: same name/upstream, high loopback TLS with the public wildcard and
# the public Authelia gate. Split from the socket block: nginx cannot
# SNI-select a certificate when TCP and Unix listeners share one server.
server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name notes.@public-domain@;
    ssl_certificate /run/secrets/tls-public.crt;
    ssl_certificate_key /run/secrets/tls-public.key;
    client_max_body_size 500M;
    error_page 497 https://$host$request_uri;

    include /etc/nginx/ingress/authelia/verify-public.conf;

    set $up_notes @backend-silverbullet@;

    location / {
        include /etc/nginx/ingress/authelia/auth_request.conf;

        proxy_pass http://$up_notes;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host notes.@public-domain@;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the ingress boundary: never trust client-supplied forwarding.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
