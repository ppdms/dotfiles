# Backrest via Cloudflare + LAN-direct — backup.@public-domain@
# Socket block (remote, Access-gated) + high loopback TLS
# block (LAN-direct with the public wildcard certificate). Split: nginx
# cannot SNI-select a certificate when TCP and Unix listeners share one
# server. Mirrors the LAN backup.@lan-domain@ vhost: same Authelia
# forward-auth boundary, same upstream.
server {
    listen unix:/run/cloudflared-origin/http.sock;
    server_name backup.@public-domain@;
    include /etc/nginx/ingress/authelia/verify-public.conf;
    set $up_backup @backend-backrest@;
    location / {
        include /etc/nginx/ingress/authelia/auth_request.conf;
        proxy_pass http://$up_backup;
        proxy_redirect http:// https://;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
# LAN-direct: same name/upstream, high loopback TLS with the public wildcard.
server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name backup.@public-domain@;
    ssl_certificate /run/secrets/tls-public.crt;
    ssl_certificate_key /run/secrets/tls-public.key;
    client_max_body_size 100M;
    error_page 497 https://$host$request_uri;
    include /etc/nginx/ingress/authelia/verify-public.conf;
    set $up_backup @backend-backrest@;
    location / {
        include /etc/nginx/ingress/authelia/auth_request.conf;
        proxy_pass http://$up_backup;
        proxy_redirect http:// https://;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
