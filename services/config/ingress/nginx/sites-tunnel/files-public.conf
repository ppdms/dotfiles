# OpenCloud via Cloudflare + LAN-direct — files.@public-domain@
# Socket block (remote, Access-gated) + high loopback TLS (LAN-direct and
# OpenCloud's local signed downloads with the public wildcard certificate).
# Split: nginx cannot SNI-select a certificate when TCP and Unix listeners
# share one server.
server {
    listen unix:/run/cloudflared-origin/http.sock;
    server_name files.@public-domain@;
    client_max_body_size 0;
    proxy_set_header Host              files.@public-domain@;
    proxy_set_header X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_redirect     off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout       3600s;
    keepalive_timeout  75s;
    gzip off;
    set $up_files @backend-opencloud@;
    # Browser OIDC token/userinfo exchange stays same-origin: Cloudflare
    # Access gates auth.@public-domain@ directly, and XHR there gets the Access
    # login redirect (CORS + connect-src failure). The discovery document is
    # rewritten so endpoint XHR carries the files.@public-domain@ Access session;
    # nginx proxies those paths to Authelia on loopback. Access still gates both
    # public names, and login/consent navigation stays on auth.@public-domain@.
    # sub_filter needs buffering on this path; the large-file bypass stays
    # on the generic location only.
    location = /.well-known/openid-configuration {
        proxy_pass http://$up_files;
        # sub_filter cannot see gzipped upstream bodies: ask OpenCloud for
        # identity; browsers re-compress on the wire if they accept gzip.
        proxy_set_header Accept-Encoding 'identity';
        sub_filter_once off;
        sub_filter_types application/json;
        sub_filter 'https://auth.@public-domain@/api/oidc/token' 'https://files.@public-domain@/oidc/token';
        sub_filter 'https://auth.@public-domain@/api/oidc/userinfo' 'https://files.@public-domain@/oidc/userinfo';
        sub_filter 'https://auth.@public-domain@/jwks.json' 'https://files.@public-domain@/oidc/jwks.json';
    }
    location = /oidc/token {
        proxy_pass http://@backend-authelia@/api/oidc/token;
        proxy_http_version 1.1;
        proxy_set_header Host              auth.@public-domain@;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  auth.@public-domain@;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location = /oidc/userinfo {
        proxy_pass http://@backend-authelia@/api/oidc/userinfo;
        proxy_http_version 1.1;
        proxy_set_header Host              auth.@public-domain@;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  auth.@public-domain@;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location = /oidc/jwks.json {
        proxy_pass http://@backend-authelia@/jwks.json;
        proxy_http_version 1.1;
        proxy_set_header Host              auth.@public-domain@;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  auth.@public-domain@;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location / {
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://$up_files;
    }
}
# LAN-direct and local backchannels: same public name, upstream, and certificate.
# OpenCloud uses files.@public-domain@ with issuer auth.@public-domain@ on both paths.
# App authentication applies on LAN; the tunnel also requires CF Access.
server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name files.@public-domain@;
    ssl_certificate /run/secrets/tls-public.crt;
    ssl_certificate_key /run/secrets/tls-public.key;
    client_max_body_size 0;
    proxy_set_header Host              files.@public-domain@;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_redirect     off;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout       3600s;
    keepalive_timeout  75s;
    gzip off;
    set $up_files @backend-opencloud@;
    # Same rewrite/proxy set as the tunnel socket block: WAN browsers reach
    # this TCP block on LAN, tunnel traffic via the socket block above.
    location = /.well-known/openid-configuration {
        proxy_pass http://$up_files;
        proxy_set_header Accept-Encoding 'identity';
        sub_filter_once off;
        sub_filter_types application/json;
        sub_filter 'https://auth.@public-domain@/api/oidc/token' 'https://files.@public-domain@/oidc/token';
        sub_filter 'https://auth.@public-domain@/api/oidc/userinfo' 'https://files.@public-domain@/oidc/userinfo';
        sub_filter 'https://auth.@public-domain@/jwks.json' 'https://files.@public-domain@/oidc/jwks.json';
    }
    location = /oidc/token {
        proxy_pass http://@backend-authelia@/api/oidc/token;
        proxy_http_version 1.1;
        proxy_set_header Host              auth.@public-domain@;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  auth.@public-domain@;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location = /oidc/userinfo {
        proxy_pass http://@backend-authelia@/api/oidc/userinfo;
        proxy_http_version 1.1;
        proxy_set_header Host              auth.@public-domain@;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  auth.@public-domain@;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location = /oidc/jwks.json {
        proxy_pass http://@backend-authelia@/jwks.json;
        proxy_http_version 1.1;
        proxy_set_header Host              auth.@public-domain@;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  auth.@public-domain@;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location / {
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://$up_files;
    }
}
