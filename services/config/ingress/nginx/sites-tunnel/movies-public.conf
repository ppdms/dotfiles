# Jellyfin via Cloudflare + LAN-direct — movies.@public-domain@
# Socket block (remote, Access-gated; Jellyfin handles its own auth) + TCP
# high loopback TLS (LAN-direct with the public wildcard certificate). Split: nginx
# cannot SNI-select a certificate when TCP and Unix listeners share one
# server.
server {
    listen unix:/run/cloudflared-origin/http.sock;
    server_name movies.@public-domain@;
    client_max_body_size 500M;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Protocol https;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    set $up_movies @backend-jellyfin@;
    location / {
        proxy_pass http://$up_movies;
    }
}
# LAN-direct: same name/upstream, high loopback TLS with the public wildcard.
server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name movies.@public-domain@;
    ssl_certificate /run/secrets/tls-public.crt;
    ssl_certificate_key /run/secrets/tls-public.key;
    client_max_body_size 500M;
    error_page 497 https://$host$request_uri;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Protocol https;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    set $up_movies @backend-jellyfin@;
    location / {
        proxy_pass http://$up_movies;
    }
}
