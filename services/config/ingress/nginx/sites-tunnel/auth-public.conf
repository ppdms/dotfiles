# Authelia portal via Cloudflare + LAN-direct — auth.@public-domain@
# Remote: cloudflared Unix socket (Access-gated). LAN: high loopback TLS with the
# public wildcard certificate. Host stays the public name so Authelia derives
# the matching OIDC issuer (auth.@public-domain@) on both paths.
server {
    listen unix:/run/cloudflared-origin/http.sock;
    server_name auth.@public-domain@;
    client_max_body_size 1M;
    set $up_authelia @backend-authelia@;
    location / {
        proxy_pass http://$up_authelia;
        proxy_http_version 1.1;
        proxy_set_header Host auth.@public-domain@;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host auth.@public-domain@;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
# LAN-direct portal: same name/cert/upstream as local TLS443 OIDC forwards.
# Split from the socket
# block: nginx cannot SNI-select a certificate when TCP and Unix listeners
# share one server — the default (@lan-domain@) cert would answer public names.
server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name auth.@public-domain@;
    ssl_certificate /run/secrets/tls-public.crt;
    ssl_certificate_key /run/secrets/tls-public.key;
    client_max_body_size 1M;
    set $up_authelia @backend-authelia@;
    location / {
        proxy_pass http://$up_authelia;
        proxy_http_version 1.1;
        proxy_set_header Host auth.@public-domain@;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host auth.@public-domain@;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
