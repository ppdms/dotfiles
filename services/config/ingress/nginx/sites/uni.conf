# Tree-eclass — uni.@lan-domain@
# Own login (e-ink devices); not gated by Authelia. The Go binary serves
# the browser UI + API directly on 8001, without SSR.
server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name uni.@lan-domain@;

    client_max_body_size 500M;
    error_page 497 https://$host$request_uri;

    set $up_tree @backend-tree-eclass@;
    # Trusted management selects the dedicated dev endpoint; empty means prod.
    include /run/nginx-state/tree-upstream.conf;

    location / {
        proxy_pass http://$up_tree;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the ingress boundary: never trust client-supplied forwarding.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
