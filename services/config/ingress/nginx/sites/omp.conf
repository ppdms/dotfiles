# OMP (Tern web terminal) — omp.@lan-domain@
# Gated by the shared @lan-domain@ Authelia session.
# Interactive terminal session: WebSockets (/wire) and unbuffered streaming.
server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name omp.@lan-domain@;

    client_max_body_size 50M;
    error_page 497 https://$host$request_uri;

    include /etc/nginx/ingress/authelia/verify.conf;

    set $up_omp @backend-omp@;
    include /etc/nginx/ingress/omp-wire-token.conf;

    location / {
        include /etc/nginx/ingress/authelia/auth_request.conf;

        proxy_pass http://$up_omp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the ingress boundary: never trust client-supplied forwarding.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Terminal output is an interactive stream, not a buffered web page.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Tern insists on a ?token= for its /wire WebSocket; nginx adds it so browsers
    # never carry it (value: nginx credential omp-web-token.conf). Defence in
    # depth: only root, the operator and nginx may reach 127.0.0.1:@port-omp@.
    location /wire {
        include /etc/nginx/ingress/authelia/auth_request.conf;

        if ($omp_web_token = "") {
            return 503;
        }
        if ($args = "") {
            rewrite ^/wire$ /wire?token=$omp_web_token break;
        }

        proxy_pass http://$up_omp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
