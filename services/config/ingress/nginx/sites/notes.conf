# SilverBullet — notes.@lan-domain@
# Gated by the shared @lan-domain@ Authelia session (like backup): the backend
# runs unauthenticated behind loopback ingress, so the forward-auth gate is the
# login boundary. Websocket/SSE upgrade uses the shared upgrade map; the
# event stream is long-lived, hence the generous timeouts.
server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name notes.@lan-domain@;

    client_max_body_size 500M;
    error_page 497 https://$host$request_uri;

    include /etc/nginx/ingress/authelia/verify.conf;

    set $up_notes @backend-silverbullet@;

    location / {
        include /etc/nginx/ingress/authelia/auth_request.conf;

        proxy_pass http://$up_notes;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the ingress boundary: never trust client-supplied forwarding.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
