# Jellyfin — movies.@lan-domain@
# Own user accounts + SSO-OIDC plugin; not gated by Authelia forward-auth
# (TV/mobile apps can't do SSO redirects).
server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name movies.@lan-domain@;

    client_max_body_size 500M;
    error_page 497 https://$host$request_uri;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Protocol $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Disable buffering — critical for smooth media streaming.
    proxy_buffering         off;
    proxy_request_buffering off;

    proxy_connect_timeout 10s;
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;

    set $up_movies @backend-jellyfin@;

    location / {
        proxy_pass http://$up_movies;
    }
}
