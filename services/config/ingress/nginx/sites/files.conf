# OpenCloud has one canonical URL/issuer. The private LAN alias redirects
# to the same LAN-direct public hostname used by remote browsers.
server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name files.@lan-domain@;
    return 308 https://files.@public-domain@$request_uri;

}
