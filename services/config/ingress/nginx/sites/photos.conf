# Immich — photos.@lan-domain@
# Own user accounts + OIDC; not gated by Authelia forward-auth
# (mobile app can't do SSO redirects).
server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name photos.@lan-domain@;

    # allow large file uploads
    client_max_body_size 50000M;
    error_page 497 https://$host$request_uri;

    # Set headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # enable websockets
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_redirect     off;

    # set timeout
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    send_timeout       600s;

    # Disable request buffering — without this nginx would buffer the entire
    # photo/video into a temp file before forwarding to Immich, which is
    # catastrophic at 50 GB client_max_body_size.
    proxy_request_buffering off;

    # Replace the backend CSP header at ingress to allow WebAssembly.
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'wasm-unsafe-eval'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src 'self' blob:;" always;

    set $up_photos @backend-immich@;

    location / {
        proxy_pass http://$up_photos;
    }
}
