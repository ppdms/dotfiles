server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name backup.@lan-domain@;

    include /etc/nginx/ingress/authelia/verify.conf;
    set $up_backup @backend-backrest@;

    location / {
        include /etc/nginx/ingress/authelia/auth_request.conf;
        proxy_pass http://$up_backup;
        proxy_redirect http:// https://;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the ingress boundary: never trust client-supplied forwarding.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
