# Termix — term.@lan-domain@
# Logged in ONLY via Authelia OIDC: password login is disabled and the SPA
# silently redirects to the auth.@public-domain@ portal (the canonical OIDC issuer —
# Authelia binds each code to the portal it was issued on, so the browser
# authorization and the container token exchange must use the same portal).
# There is deliberately no nginx auth gate: it would validate the *.@lan-domain@
# session while the OIDC flow establishes the @public-domain@ session, producing a
# redirect loop. Termix's own OIDC-only auth is the boundary here.
map $http_upgrade $termix_connection {
    default     "upgrade";
    ""          "keep-alive";
}

server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name term.@lan-domain@;

    ssl_certificate /run/secrets/tls.crt;
    ssl_certificate_key /run/secrets/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    error_page 497 https://$host$request_uri;

    set $up_termix @backend-termix@;

    location / {
        proxy_pass http://$up_termix;
        proxy_http_version 1.1;
        proxy_set_header Upgrade              $http_upgrade;
        proxy_set_header Connection           $termix_connection;
        proxy_set_header Host                 $host;
        proxy_set_header X-Real-IP            $remote_addr;
        proxy_set_header X-Forwarded-For      $remote_addr;
        proxy_set_header X-Forwarded-Host     $host;
        proxy_set_header X-Forwarded-Proto    $scheme;

        # Terminal output is an interactive stream, not a buffered web page.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
