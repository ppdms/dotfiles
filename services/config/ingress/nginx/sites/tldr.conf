# Readeck — tldr.@lan-domain@
# GATED by the shared Authelia forward-auth boundary; Readeck's own account
# remains for bookmark/asset management inside the app.
server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name tldr.@lan-domain@;

    include /etc/nginx/ingress/authelia/verify.conf;

    client_max_body_size 50M;
    error_page 497 https://$host$request_uri;

    set $up_tldr @backend-readeck@;

    location / {
        include /etc/nginx/ingress/authelia/auth_request.conf;

        proxy_redirect http:// https://;
        proxy_pass http://$up_tldr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the ingress boundary: never trust client-supplied forwarding.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
