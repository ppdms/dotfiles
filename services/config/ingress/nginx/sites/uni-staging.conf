# Tree-eclass staging — staging.uni.@lan-domain@ (LAN-only, no tunnel route)
# Own login (e-ink devices); not gated by Authelia. Parallel to prod: this
# block always proxies the dev stack directly, so `uni` never flaps while
# staging is up, syncing or down (down answers 502 here, prod is untouched).
server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name staging.uni.@lan-domain@;

    client_max_body_size 500M;
    error_page 497 https://$host$request_uri;

    location / {
        proxy_pass http://@backend-tree-dev@;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the ingress boundary: never trust client-supplied forwarding.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
