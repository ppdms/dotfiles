# Home Assistant — ha.@lan-domain@
# Own password auth is the only gate (no Authelia, no trusted_networks):
# the companion app and bearer-token REST/websocket clients cannot do
# forward-auth redirects. HA serves its own TLS on 8123 using its LAN
# certificate; proxy TLS is terminated here and upstream verification is skipped.
server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name ha.@lan-domain@;

    client_max_body_size 100M;
    error_page 497 https://$host$request_uri;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # HA's frontend is websocket-heavy.
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    set $up_ha @backend-homeassistant@;

    location / {
        proxy_pass https://$up_ha;
        proxy_ssl_verify off;
    }
}
