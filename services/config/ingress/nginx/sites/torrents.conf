# Transmission web UI — torrents.@lan-domain@
# Gated by the shared @lan-domain@ Authelia session; RPC auth is still enforced
# by Transmission itself.
server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name torrents.@lan-domain@;

    # Gluetun publishes only the WebUI on host loopback; its kill-switch remains.
    set $up_torrents @backend-transmission@;

    client_max_body_size 500M;
    proxy_hide_header X-Frame-Options;
    error_page 497 https://$host$request_uri;

    include /etc/nginx/ingress/authelia/verify.conf;

    location / {
        include /etc/nginx/ingress/authelia/auth_request.conf;

        proxy_read_timeout  300s;
        proxy_set_header    Host                 $host;
        proxy_set_header    X-Forwarded-Proto    $scheme;
        proxy_set_header    X-Forwarded-Protocol $scheme;
        proxy_set_header    X-Real-IP            $remote_addr;
        proxy_pass_header   X-Transmission-Session-Id;
        proxy_set_header    X-Forwarded-Host     $host;
        proxy_set_header    X-Forwarded-Server   $host;
        # This is the ingress boundary: never trust client-supplied forwarding.
        proxy_set_header    X-Forwarded-For      $remote_addr;
        proxy_pass          http://$up_torrents;
    }
}
