# LibreSpeed — speedtest.@lan-domain@
# Gated by the shared @lan-domain@ Authelia session. Stateless canary UI; never
# run a bandwidth test during restore.
server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name speedtest.@lan-domain@;

    # Disable buffering — speedtest measures raw throughput;
    # buffering would distort the results.
    proxy_buffering off;
    proxy_request_buffering off;

    include /etc/nginx/ingress/authelia/verify.conf;

    error_page 497 https://$host$request_uri;

    set $up_speedtest @backend-speedtest@;

    location / {
        include /etc/nginx/ingress/authelia/auth_request.conf;

        proxy_pass http://$up_speedtest;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # This is the ingress boundary: never trust client-supplied forwarding.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
