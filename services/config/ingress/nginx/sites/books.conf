# Kavita — books.@lan-domain@
# Logged in ONLY via Authelia OIDC (Auto Login + Disable Password in the
# app UI, pointing at the auth.@public-domain@ issuer — Authelia binds each code
# to the portal it was issued on). There is deliberately no nginx auth
# gate: same reason as term — it would validate the @lan-domain@ session while
# the OIDC flow establishes the @public-domain@ session, producing a loop.
server {
    listen 127.0.0.1:@port-nginxHttps@ ssl;
    http2 on;
    server_name books.@lan-domain@;

    client_max_body_size 500M;
    error_page 497 https://$host$request_uri;

    set $up_kavita @backend-kavita@;

    location / {
        proxy_pass http://$up_kavita;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the ingress boundary: never trust client-supplied forwarding.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
