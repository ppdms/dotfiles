worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Backends are explicit host-loopback endpoints, never shared-runtime DNS.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # Only the private tunnel transport receives edge-supplied forwarding.
    # TCP clients cannot select their address by sending forwarding headers.
    map $server_addr $ingress_forwarded_for {
        "~^unix:" $http_x_forwarded_for;
        default $remote_addr;
    }

    ssl_certificate /run/secrets/tls.crt;
    ssl_certificate_key /run/secrets/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    add_header X-Content-Type-Options nosniff always;

    server {
        listen 127.0.0.1:@port-nginxHttp@ default_server;
        server_name _;
        return 444;
    }
    server {
        listen unix:/run/cloudflared-origin/http.sock default_server;
        server_name _;
        return 444;
    }
    server {
        listen 127.0.0.1:@port-nginxHttps@ ssl default_server;
        ssl_reject_handshake on;
        server_name _;
        return 444;
    }
    # Unknown @public-domain@ subdomains fail closed on the LAN path; every known
    # public hostname declares the high loopback TLS listener with its certificate.
    server {
        listen 127.0.0.1:@port-nginxHttp@;
        server_name backup.@lan-domain@ auth.@lan-domain@ photos.@lan-domain@ files.@lan-domain@ notes.@lan-domain@ term.@lan-domain@ movies.@lan-domain@ tldr.@lan-domain@ speedtest.@lan-domain@ torrents.@lan-domain@ books.@lan-domain@ ha.@lan-domain@ omp.@lan-domain@ auth.@public-domain@ photos.@public-domain@ files.@public-domain@ term.@public-domain@ notes.@public-domain@ movies.@public-domain@ tldr.@public-domain@ speedtest.@public-domain@ torrents.@public-domain@ books.@public-domain@ ha.@public-domain@ omp.@public-domain@ backup.@public-domain@;
        return 301 https://$host$request_uri;
    }

    include /etc/nginx/ingress/sites/*.conf;
    include /tmp/nginx-sites-tunnel/*.conf;
}
